<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


    <body>
 
     <button onclick="show()"> show me </button>
     <button onclick="hide()"> hide it </button>
     <img src="parrot.jpg" id="demo">


     </body>

   
    <script>



    function show(){
      var show=document.getElementById("demo")
      show.style.display="block"

    }

    function hide(){
      var show=document.getElementById("demo")
      show.style.display="none"
    }



        
        
    
        
    </script>
    
</body>
</html>
