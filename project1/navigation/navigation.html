<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://icono-49d6.kxcdn.com/icono.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="navigation.css">
    <title>Navigation</title>
</head>
<body>
    <div class="navigation">
        <ul>
            <li class="list">
                <a href="#">
                    <span class="fas fa-home"></span>
                    <span class="title">Home</span>
                </a>
            </li>

            <li class="list">
                <a href="#">
                    <span class="fas fa-people-group"></span>
                    <span class="title">People</span>
                </a>
            </li>

            <li class="list">
                <a href="#">
                    <span class="fas fa-person"></span>
                    <span class="title">Profile</span>
                </a>
            </li>


            <li class="list">
                <a href="#">
                    <span class="fas fa-comments"></span>
                    <span class="title">Messages</span>
                </a>
            </li>

            <li class="list">
                <a href="#">
                    <span class="fas fa-gear"></span>
                    <span class="title">Setting</span>
                </a>
            </li>

            <li class="list">
                <a href="#">
                    <span class="fas fa-question"></span>
                    <span class="title">Help</span>
                </a>
            </li>

            <li class="list">
                <a href="#">
                    <span class="fas fa-lock"></span>
                    <span class="title">locked</span>
                </a>
            </li>

            
            <li class="list">
                <a href="#">
                    <span class="fas fa-sign-in"></span>
                    <span class="title">Sign-in</span>
                </a>
            </li>
        </ul>
    </div>


    <div class="toggle">
        <span class="open icono-hamburger"></span>
        <span class="close icono-cross"></span>
    </div>

    <script src="navigation.js"></script>
</body>
</html>
