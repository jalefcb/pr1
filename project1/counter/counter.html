<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="counter.css">
    <title>Counter</title>
</head>

<body>
    
    <div class="container">
        <div class="box">
            <i class="fas fa-coffee"></i>
            <p class="counter" data="10000"> 10000 </p>
            <p> قهوه های خورده شده </p>
        </div>

        <div class="box">
            <i class="fas fa-users"></i>
            <p class="counter" data="1500"> 1500 </p>
            <p> کاربران </p>
        </div>

        <div class="box">
            <i class="fas fa-code"></i>
            <p class="counter" data="150000"> 150000 </p>
            <p> خط کدهای نوشته شده </p>
        </div>

        <div class="box">
            <i class="fas fa-lightbulb"></i>
            <p class="counter" data="7000"> 7000 </p>
            <p>  پروژه ها </p>
        </div>
    </div>


    <script src="counter.js"></script>
</body>

</html>
